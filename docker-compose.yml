version: '3.8'

services:
  bot:
    build: .
    container_name: telegram_bot
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: telegram_postgres
    restart: always
    environment:
      POSTGRES_DB: telegramdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
